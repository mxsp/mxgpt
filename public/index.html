  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <a class="brand" href="/" id="brand">
        <span class="brand-star"><svg><use href="#i-star"/></svg></span>
        <span class="brand-name">mx-GPT</span>
      </a>
      <div style="display:flex;gap:2px">
        <button class="icon-btn sb-collapse" id="importChatBtn" title="Import chat JSON"><svg><use href="#i-upload"/></svg></button>
        <button class="icon-btn sb-collapse" id="collapseBtn" title="Collapse sidebar"><svg><use href="#i-panel"/></svg></button>
      </div>
    </div>
    <button class="new-chat" id="newChat">
      <svg><use href="#i-plus"/></svg><span>New chat</span>
      <span class="kbd">⌘K</span>
    </button>
    <div class="sb-search">
      <svg><use href="#i-search"/></svg>
      <input id="chatSearch" type="search" placeholder="Search chats" autocomplete="off">
    </div>
    <nav class="chat-list" id="chatList" aria-label="Chats"></nav>
    <div class="sb-foot">
      <button class="user-chip" id="userBtn">
        <span class="avatar" id="userAvatar">K</span>
        <span class="user-meta"><b id="userName">User</b><small id="userSub">Local workspace</small></span>
        <svg class="uc-chev"><use href="#i-settings"/></svg>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" title="Menu"><svg><use href="#i-panel"/></svg></button>
      <button class="icon-btn sb-expand-btn" id="expandBtn" title="Open sidebar" hidden><svg><use href="#i-panel"/></svg></button>
      <div class="top-title">
        <span id="chatTitle">New chat</span>
        <span class="model-pill" id="topModel">local</span>
        <button class="persona-pill" id="personaBtn" title="Choose assistant persona or per-chat instructions"><svg><use href="#i-spark"/></svg><span id="personaLabel">Default</span></button>
        <button class="work-pill" id="workPill" hidden></button>
      </div>
      <div class="top-actions">
        <button class="ghost-btn" data-panel="notes" title="Saved memory notes"><svg><use href="#i-book"/></svg><span>Notes</span></button>
        <button class="ghost-btn" data-panel="files"><svg><use href="#i-folder"/></svg><span>Files</span></button>
        <button class="ghost-btn" data-panel="browser"><svg><use href="#i-globe"/></svg><span>Browser</span></button>
        <button class="icon-btn" id="themeBtn" title="Toggle theme"><svg><use href="#i-moon"/></svg></button>
      </div>
    </header>

    <main class="main" id="main">
      <div class="scroll-area" id="scrollArea">
        <section class="welcome" id="welcome">
          <div class="welcome-star"><svg><use href="#i-star"/></svg></div>
          <h1 id="greeting">Good evening</h1>
          <p class="welcome-sub">Your private AI workspace. What should we make today?</p>
          <div class="suggestions">
            <button data-prompt="Build me a beautiful single-page dashboard with charts and a dark mode toggle."><svg><use href="#i-code"/></svg><span>Build an interactive dashboard</span></button>
            <button data-prompt="Search the web for the latest local LLM news and summarize the three most important stories with sources."><svg><use href="#i-globe"/></svg><span>Research today's AI news</span></button>
            <button data-prompt="Use the JavaScript runner to simulate 10,000 Monty Hall games and compare switching vs staying."><svg><use href="#i-wrench"/></svg><span>Run a quick simulation</span></button>
            <button data-prompt="List the files in my workspace and tell me what projects are in here."><svg><use href="#i-folder"/></svg><span>Explore my workspace</span></button>
          </div>
        </section>
        <div class="messages" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer" id="composer">
          <div class="attach-row" id="attachRow"></div>
          <textarea id="input" rows="1" placeholder="How can I help you today?" spellcheck="false"></textarea>
          <div class="composer-bar">
            <div class="c-left">
              <button class="icon-btn" id="attachBtn" title="Attach files or images"><svg><use href="#i-plus"/></svg></button>
              <button class="tool-toggle" data-tool="subagents" id="subagentsToggle" title="Delegate subtasks to fast local sub-3B subagents"><svg><use href="#i-agents"/></svg><span>Agents</span></button>
              <button class="tool-toggle" data-tool="tools" title="Built-in tools: calculator, sandboxed JS runner, date/time, persistent notes"><svg><use href="#i-wrench"/></svg><span>Tools</span></button>
              <button class="tool-toggle on" data-tool="web" title="Let mx-GPT search, browse the web, and look up Wikipedia"><svg><use href="#i-globe"/></svg><span>Web</span></button>
              <button class="tool-toggle" data-tool="files" title="Let mx-GPT search, read, and edit workspace files"><svg><use href="#i-folder"/></svg><span>Files</span></button>
              <div class="think-control" id="thinkControl" title="Controls reasoning depth for models that support thinking. Off is fastest.">
                <span class="think-label"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a7 7 0 0 0-4 12.7V18a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 3Z"/><path d="M9 21h6"/></svg>Think</span>
                <div class="think-seg" role="radiogroup" aria-label="Thinking effort">
                  <button type="button" data-v="off">Off</button>
                  <button type="button" data-v="low" class="on">Low</button>
                  <button type="button" data-v="medium">Med</button>
                  <button type="button" data-v="high">High</button>
                </div>
              </div>
            </div>
            <div class="c-right">
              <button class="icon-btn" id="micBtn" title="Voice input" hidden><svg><use href="#i-mic"/></svg></button>
              <div class="mode-control" id="modeControl" data-mode="fast" title="Fast = LFM3 1.7B (instant). Smart = Inkling 26B (deeper, slower).">
                <div class="mode-seg" role="radiogroup" aria-label="Model mode">
                  <span class="mode-thumb" aria-hidden="true"></span>
                  <button type="button" data-mode="fast" class="on" role="radio" aria-checked="true" title="Fast — LFM3 1.7B. Instant replies."><svg><use href="#i-cpu"/></svg><span>Fast</span></button>
                  <button type="button" data-mode="smart" role="radio" aria-checked="false" title="Smart — Inkling 26B. Deeper reasoning, slower."><svg><use href="#i-spark"/></svg><span>Smart</span></button>
                </div>
              </div>
              <button class="model-chip" id="modelBtn"><span id="modelLabel">loading…</span><svg><use href="#i-chevron-down"/></svg></button>
              <button class="send-btn" id="sendBtn" title="Send"><svg><use href="#i-send"/></svg></button>
            </div>
          </div>
        </div>
        <div class="fineprint">mx-GPT can make mistakes. Check important info. <span class="dot">·</span> <span id="footHost">Running locally</span> <span class="dot">·</span> <button class="link-btn" id="shortcutsBtn" type="button">Shortcuts</button></div>
      </div>
    </main>
  </div>

  <aside class="panel" id="panel" aria-hidden="true">
    <header class="panel-head">
      <div class="panel-heading">
        <span class="panel-icon" id="panelIcon"><svg><use href="#i-code"/></svg></span>
        <span class="panel-title" id="panelTitle">Artifact</span>
      </div>
      <div class="panel-head-actions" id="panelActions"></div>
      <button class="icon-btn" id="panelClose" title="Close panel"><svg><use href="#i-x"/></svg></button>
    </header>
    <div class="panel-tabs" id="panelTabs"></div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
  <div class="panel-scrim" id="panelScrim"></div>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePicker" multiple hidden>
<input type="file" id="panelUpload" multiple hidden>
<input type="file" id="importPicker" accept=".json,application/json" hidden>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/app.js?v=20261126b"></script>
</body>
</html>
